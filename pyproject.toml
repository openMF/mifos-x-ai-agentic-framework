[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mifos-agentic-framework"
version = "0.1.0"
description = "Prototype Portfolio Health Agent for explainable Mifos loan monitoring."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mifos AI contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mifos-portfolio-agent = "mifos_agentic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
